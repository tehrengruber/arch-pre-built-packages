name: Build Arch Linux package

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label"
        required: true
        type: string
      package_repo:
        description: "Git URL of the package repo containing the PKGBUILD (or set package_dir)"
        required: false
        type: string
      package_dir:
        description: "Directory in the calling repo containing the PKGBUILD, used instead of package_repo"
        required: false
        type: string
      package_name:
        description: "Name of the package"
        required: true
        type: string
      arch:
        description: "Target architecture (x86_64 or aarch64); must match the runner's architecture"
        required: false
        type: string
        default: x86_64
      release_tag:
        description: "Release tag to upload the package to"
        required: false
        type: string
      pgp_keys:
        description: "Space-separated PGP key IDs to import before building"
        required: false
        type: string
      skip_tests:
        description: "Skip the check() phase of makepkg ('true' to skip)"
        required: false
        type: string
        default: ""
    secrets:
      GPG_PRIVATE_KEY:
        description: "GPG private key for signing packages"
        required: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write GPG key
        run: umask 077; echo "$GPG_KEY" > /tmp/gpg-private.key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Fetch previous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package_name }}
          ARCH: ${{ inputs.arch }}
          REPO: ${{ github.repository }}
          TEMP_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p prev pkg-out
          if [ -n "$TEMP_TAG" ]; then
            WITHOUT_PREFIX="${TEMP_TAG#pending-}"
            FINAL_TAG="${WITHOUT_PREFIX%-*}"
          else
            FINAL_TAG="latest"
          fi
          TAGS=$(gh release list --repo "$REPO" --json tagName,createdAt \
            | jq -r --arg ft "$FINAL_TAG" \
              '[.[] | select(.tagName == $ft or (.tagName | startswith("pending-" + $ft + "-")))] | sort_by(.createdAt) | reverse | .[].tagName')
          HASH_FILE="${PKG}.${ARCH}.aur-hash"
          for TAG in $TAGS; do
            rm -f prev/*
            gh release download "$TAG" --repo "$REPO" --dir prev --pattern "$HASH_FILE" 2>/dev/null || continue
            # Line 1 is the source hash, the remaining lines the package files built from it.
            PATTERNS=()
            while read -r f; do PATTERNS+=(--pattern "$f" --pattern "$f.sig"); done < <(tail -n +2 "prev/$HASH_FILE")
            [ ${#PATTERNS[@]} -gt 0 ] || continue
            if gh release download "$TAG" --repo "$REPO" --dir prev "${PATTERNS[@]}"; then
              echo "Found previous artifacts in $TAG"
              break
            fi
          done

      - name: Build (or reuse) package
        uses: tehrengruber/arch-pre-built-packages/.github/actions/archlinux-docker@v0.1
        with:
          mount: |
            ${{ github.workspace }}/pkg-out:/pkg-out
            ${{ github.workspace }}/prev:/prev:ro
            ${{ github.workspace }}:/src:ro
            /tmp/gpg-private.key:/tmp/gpg-private.key:ro
          run: |
            # The cached image's sync DB can be up to a day old; mirrors drop
            # superseded packages, so installing deps from it 404s. Refresh
            # first (full -Syu: partial upgrades are unsupported).
            pacman -Syu --noconfirm
            git config --file /etc/makepkg.d/gitconfig user.email "till@ehrengruber.ch"
            git config --file /etc/makepkg.d/gitconfig user.name "Till Ehrengruber"
            # Build as an unprivileged user, as Arch does: some test suites
            # (e.g. nginx's) fail as root. sudo lets makepkg -s install deps.
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            as_builder() { sudo -u builder -H "$@"; }
            # Via stdin: the key file is only readable by root.
            as_builder gpg --batch --import < /tmp/gpg-private.key
            if [ -n "${{ inputs.pgp_keys }}" ]; then
              as_builder gpg --recv-keys ${{ inputs.pgp_keys }}
            fi

            PKG_DIR="${{ inputs.package_dir }}"
            if [ -n "$PKG_DIR" ]; then
              # Tree hash of the directory: only changes to the package itself trigger a rebuild.
              cp -r "/src/$PKG_DIR" /pkg
              SRC_HASH=$(git -C /src rev-parse "HEAD:$PKG_DIR")
            else
              git clone "${{ inputs.package_repo }}" /pkg
              SRC_HASH=$(git -C /pkg rev-parse HEAD)
            fi
            chown -R builder: /pkg
            PKG="${{ inputs.package_name }}"
            HASH_FILE="${PKG}.${{ inputs.arch }}.aur-hash"
            REUSE=0

            if [ -f "/prev/$HASH_FILE" ] && [ "$(head -1 "/prev/$HASH_FILE")" = "$SRC_HASH" ]; then
              mapfile -t PREV_PKGS < <(tail -n +2 "/prev/$HASH_FILE" | sed 's|^|/prev/|')
              PREV_PKG="${PREV_PKGS[0]:-}"
              if [ -n "$PREV_PKG" ] && ls "${PREV_PKGS[@]}" >/dev/null 2>&1; then
                DRIFT=0
                while IFS= read -r line; do
                  case "$line" in
                    "installed = "*)
                      ENTRY="${line#installed = }"
                      REST="${ENTRY%-*}"
                      REL="${REST##*-}"; REST="${REST%-*}"
                      VER="${REST##*-}"; NAME="${REST%-*}"
                      CUR=$(pacman -Si "$NAME" 2>/dev/null | awk -F': +' '/^Version/ {print $2; exit}')
                      if [ "$CUR" != "$VER-$REL" ]; then DRIFT=1; break; fi
                      ;;
                  esac
                done < <(bsdtar -xOf "$PREV_PKG" .BUILDINFO)
                if [ "$DRIFT" = "0" ]; then
                  for f in "${PREV_PKGS[@]}"; do cp "$f" "$f.sig" /pkg/; done
                  echo "Reused previous build (source hash + BUILDINFO match)"
                  REUSE=1
                fi
              fi
            fi

            if [ "$REUSE" = "0" ]; then
              EXTRA_ARGS=""
              if [ "${{ inputs.skip_tests }}" = "true" ]; then
                EXTRA_ARGS="--nocheck"
              fi
              cd /pkg && as_builder makepkg -s --noconfirm --sign $EXTRA_ARGS
            fi
            (echo "$SRC_HASH"; cd /pkg && ls *.pkg.tar.* | grep -v '\.sig$') > "/pkg/$HASH_FILE"

            cp /pkg/*.pkg.tar.* "/pkg/$HASH_FILE" /pkg-out/

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ inputs.package_name }}-${{ inputs.arch }}
          path: |
            pkg-out/*.pkg.tar.*
            pkg-out/*.aur-hash

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber: a re-run of the build uploads into the same pending
        # release, which may already hold this package from a previous attempt.
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            pkg-out/*.pkg.tar.* pkg-out/*.aur-hash \
            --repo "${{ github.repository }}" --clobber

      - name: Remove GPG key
        if: always()
        run: rm -f /tmp/gpg-private.key